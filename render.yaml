services:
  - type: web
    name: worksession-tracker-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: DEFAULT_UPDATE_INTERVAL_SEC
        value: "60"
      - key: DEFAULT_DISTANCE_FILTER_M
        value: "100"
      - key: STALE_THRESHOLD_SEC
        value: "180"
      - key: LOCATION_RETENTION_DAYS
        value: "90"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "120"
      - key: CONSENT_POLICY_VERSION
        value: 2026-09-v1
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        value: postgresql://postgres.ihzemkmhebjcbscshvlk:WorkSession2026!@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
      - key: JWT_SECRET
        value: worksession-prod-secret-abc123xyz-supabase
