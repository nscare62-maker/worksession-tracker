[build]
  publish = "dist"
  command = "npm run build"

# ── Proxy all /api/* calls to the Render.com backend ────────────────────────
[[redirects]]
  from = "/api/*"
  to = "https://worksession-tracker-backend.onrender.com/:splat"
  status = 200
  force = true

# ── SPA fallback ─────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
