[build]
  publish = "dist"
  command = "npm run build"

# ── Route all API paths to the serverless function ──────────────────────────
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# ── SPA fallback ─────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
